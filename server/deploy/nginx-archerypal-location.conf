# Archerypal match relay — include from universeconflict.duckdns.org server blocks.

# Mobile app: MATCH_SERVER_URL=https://universeconflict.duckdns.org

#

# Requires nginx-archerypal-http.conf in http {} (rate limit zones + log redaction).



location = /health {

    limit_req zone=archerypal_api burst=60 nodelay;

    access_log /var/log/nginx/archerypal.access.log archerypal_safe;

    proxy_pass http://127.0.0.1:8080/health;

    proxy_http_version 1.1;

    proxy_set_header Host $host;

    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $scheme;

}



location = /v1/players/register {

    limit_req zone=archerypal_register burst=3 nodelay;

    access_log /var/log/nginx/archerypal.access.log archerypal_safe;

    proxy_pass http://127.0.0.1:8080/v1/players/register;

    proxy_http_version 1.1;

    proxy_set_header Host $host;

    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $scheme;

}



location ^~ /v1/ {

    client_max_body_size 8m;

    limit_req zone=archerypal_api burst=60 nodelay;

    access_log /var/log/nginx/archerypal.access.log archerypal_safe;

    proxy_pass http://127.0.0.1:8080/v1/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;

    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;

    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 60s;

    proxy_send_timeout 3600s;

    proxy_read_timeout 3600s;

}

