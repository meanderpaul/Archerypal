# Rate limit zones — include in nginx http {} block (see setup-z800.sh)
limit_req_zone $binary_remote_addr zone=archerypal_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=archerypal_api:10m rate=30r/s;

# Redact JWT tokens from access logs for WebSocket room upgrades
map $request_uri $archerypal_log_uri {
    ~^(?<prefix>/v1/room/[^?]+)\?token= $prefix?token=[REDACTED];
    default $request_uri;
}

log_format archerypal_safe '$remote_addr - $remote_user [$time_local] '
    '"$request $archerypal_log_uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';
